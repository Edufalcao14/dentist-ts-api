  # ──────────────────── PAYMENTS ────────────────────
  /api/appointments/{appointmentId}/payments:
    get:
      summary: List payments for an appointment
      operationId: getAllPayments
      tags: [Payments]
      parameters:
        - $ref: '#/components/parameters/AppointmentIdParam'
      responses:
        '200':
          description: Payment list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Payment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      summary: Create payment
      operationId: createPayment
      tags: [Payments]
      parameters:
        - $ref: '#/components/parameters/AppointmentIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentRequest'
      responses:
        '201':
          description: Payment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/appointments/{appointmentId}/payments/{id}:
    get:
      summary: Get payment by ID
      operationId: getPaymentById
      tags: [Payments]
      parameters:
        - $ref: '#/components/parameters/AppointmentIdParam'
        - $ref: '#/components/parameters/BigIntId'
      responses:
        '200':
          description: Payment found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      summary: Update payment
      operationId: updatePayment
      tags: [Payments]
      parameters:
        - $ref: '#/components/parameters/AppointmentIdParam'
        - $ref: '#/components/parameters/BigIntId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePaymentRequest'
      responses:
        '200':
          description: Payment updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      summary: Delete payment
      operationId: deletePayment
      tags: [Payments]
      parameters:
        - $ref: '#/components/parameters/AppointmentIdParam'
        - $ref: '#/components/parameters/BigIntId'
      responses:
        '204':
          description: Payment deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

# ──────────────────────────────────────────────────────────────
components:
  parameters:
    BigIntId:
      name: id
      in: path
      required: true
      description: Resource ID (BIGSERIAL serialised as string)
      schema:
        type: string
        example: '1'

    AppointmentIdParam:
      name: appointmentId
      in: path
      required: true
      description: Appointment ID
      schema:
        type: string
        example: '42'

  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid authentication token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Authenticated but not authorised for this resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    # ── Common ──
    Error:
      type: object
      properties:
        message:
          type: string
          example: Resource not found

    # ── Auth ──
    SignInRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: admin@clinic.com
        password:
          type: string
          format: password
          example: secret123

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          example: admin@clinic.com

    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    AuthPayload:
      type: object
      required: [user, accessToken, refreshToken]
      properties:
        user:
          $ref: '#/components/schemas/User'
        accessToken:
          type: string
          example: eyJhbGci...
        refreshToken:
          type: string
          example: eyJhbGci...

    AuthTokens:
      type: object
      required: [accessToken, refreshToken, expiredAt]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiredAt:
          type: string
          format: date-time

