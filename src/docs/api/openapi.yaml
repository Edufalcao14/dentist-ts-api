  /api/services/{id}:
    get:
      summary: Get service by ID
      operationId: getServiceById
      tags: [Services]
      parameters:
        - $ref: '#/components/parameters/BigIntId'
      responses:
        '200':
          description: Service found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      summary: Update service
      operationId: updateService
      tags: [Services]
      parameters:
        - $ref: '#/components/parameters/BigIntId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateServiceRequest'
      responses:
        '200':
          description: Service updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      summary: Soft-delete service
      operationId: deleteService
      tags: [Services]
      parameters:
        - $ref: '#/components/parameters/BigIntId'
      responses:
        '204':
          description: Service deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ──────────────────── APPOINTMENTS ────────────────────
  /api/appointments:
    get:
      summary: List appointments
      operationId: getAllAppointments
      tags: [Appointments]
      responses:
        '200':
          description: Appointment list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Appointment'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      summary: Create appointment
      operationId: createAppointment
      tags: [Appointments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAppointmentRequest'
      responses:
        '201':
          description: Appointment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/appointments/{id}:
    get:
      summary: Get appointment by ID
      operationId: getAppointmentById
      tags: [Appointments]
      parameters:
        - $ref: '#/components/parameters/BigIntId'
      responses:
        '200':
          description: Appointment found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      summary: Update appointment
      operationId: updateAppointment
      tags: [Appointments]
      parameters:
        - $ref: '#/components/parameters/BigIntId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAppointmentRequest'
      responses:
        '200':
          description: Appointment updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      summary: Soft-delete appointment
      operationId: deleteAppointment
      tags: [Appointments]
      parameters:
        - $ref: '#/components/parameters/BigIntId'
      responses:
        '204':
          description: Appointment deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ──────────────────── APPOINTMENT SERVICES ────────────────────
  /api/appointments/{appointmentId}/services:
    get:
      summary: List services for an appointment
      operationId: getAllAppointmentServices
      tags: [AppointmentServices]
      parameters:
        - $ref: '#/components/parameters/AppointmentIdParam'
      responses:
        '200':
          description: Appointment service list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AppointmentService'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      summary: Add a service to an appointment
      operationId: createAppointmentService
      tags: [AppointmentServices]
      parameters:
        - $ref: '#/components/parameters/AppointmentIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAppointmentServiceRequest'
      responses:
        '201':
          description: Appointment service added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentService'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/appointments/{appointmentId}/services/{id}:
    get:
      summary: Get appointment service by ID
      operationId: getAppointmentServiceById
      tags: [AppointmentServices]
      parameters:
        - $ref: '#/components/parameters/AppointmentIdParam'
        - $ref: '#/components/parameters/BigIntId'
      responses:
        '200':
          description: Appointment service found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentService'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      summary: Update appointment service
      operationId: updateAppointmentService
      tags: [AppointmentServices]
      parameters:
        - $ref: '#/components/parameters/AppointmentIdParam'
        - $ref: '#/components/parameters/BigIntId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAppointmentServiceRequest'
      responses:
        '200':
          description: Appointment service updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentService'
        '401':
