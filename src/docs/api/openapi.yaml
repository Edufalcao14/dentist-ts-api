openapi: 3.0.0
info:
  version: 2.0.0
  title: Dentist Platform API
  description: |
    Multi-tenant dentist platform API.

    All CRUD endpoints (except `POST /tenants` and the auth endpoints) require a valid Firebase JWT
    passed as `Authorization: Bearer <token>`. The token is resolved to a database user and
    tenant context by the `requireTenantAuth` middleware — all resources are automatically
    scoped to the authenticated tenant.

    **ID fields** are returned as `string` representations of 64-bit integers (BIGSERIAL).
    Send them back as strings in request bodies whenever an ID is required.

servers:
  - url: http://localhost:3001
    description: Development server

tags:
  - name: Auth
    description: Authentication — sign-in, token refresh, forgot-password.
  - name: Tenants
    description: Tenant registration and management.
  - name: Users
    description: User management within a tenant.
  - name: Dentists
    description: Dentist profile management.
  - name: Patients
    description: Patient profile management.
  - name: Services
    description: Dental services (catalogue) offered by a tenant.
  - name: Appointments
    description: Appointment scheduling and management.
  - name: AppointmentServices
    description: Services performed during an appointment.
  - name: Payments
    description: Payments linked to an appointment.

security:
  - BearerAuth: []

paths:
  # ──────────────────── AUTH ────────────────────
  /api/auth/sign-in:
    post:
      summary: Sign in
      description: Authenticates a user with email + password and returns Firebase tokens plus the resolved user profile.
      operationId: signIn
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthPayload'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/refresh:
    post:
      summary: Refresh tokens
      description: Exchanges a refresh token for a new access + refresh token pair.
      operationId: refreshTokens
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Tokens refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/forgot-password:
    post:
      summary: Send password reset email
      description: Sends a password reset email. Always returns 204 to avoid user enumeration.
      operationId: forgotPassword
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '204':
          description: Email sent (or silently ignored)
        '400':
          $ref: '#/components/responses/BadRequest'

  # ──────────────────── TENANTS ────────────────────
  /api/tenants:
    post:
      summary: Register a new tenant
      description: Public endpoint — creates a new tenant (clinic registration).
      operationId: createTenant
      tags: [Tenants]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTenantRequest'
      responses:
        '201':
          description: Tenant created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/tenants/{id}:
    get:
      summary: Get tenant by ID
      description: Returns the tenant the authenticated user belongs to.
      operationId: getTenantById
      tags: [Tenants]
      parameters:
        - $ref: '#/components/parameters/BigIntId'
      responses:
        '200':
          description: Tenant found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      summary: Update tenant
      operationId: updateTenant
      tags: [Tenants]
      parameters:
        - $ref: '#/components/parameters/BigIntId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTenantRequest'
      responses:
        '200':
          description: Tenant updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      summary: Soft-delete tenant
      operationId: deleteTenant
      tags: [Tenants]
      parameters:
        - $ref: '#/components/parameters/BigIntId'
      responses:
        '204':
          description: Tenant deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ──────────────────── USERS ────────────────────
  /api/users:
    get:
      summary: List users
      description: Returns all users belonging to the authenticated tenant.
      operationId: getAllUsers
      tags: [Users]
      responses:
        '200':
          description: User list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      summary: Create user
      description: Creates a new user (and Firebase account) within the authenticated tenant.
      operationId: createUser
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/users/{id}:
    get:
      summary: Get user by ID
      operationId: getUserById
      tags: [Users]
      parameters:
        - $ref: '#/components/parameters/BigIntId'
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      summary: Update user
      operationId: updateUser
      tags: [Users]
      parameters:
        - $ref: '#/components/parameters/BigIntId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      summary: Soft-delete user
      operationId: deleteUser
      tags: [Users]
      parameters:
        - $ref: '#/components/parameters/BigIntId'
      responses:
        '204':
          description: User deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ──────────────────── DENTISTS ────────────────────
  /api/dentists:
    get:
      summary: List dentists
      operationId: getAllDentists
      tags: [Dentists]
      responses:
        '200':
          description: Dentist list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dentist'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      summary: Create dentist profile
      description: Links an existing user to a dentist profile.
      operationId: createDentist
      tags: [Dentists]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDentistRequest'
      responses:
        '201':
          description: Dentist created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dentist'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/dentists/{id}:
    get:
      summary: Get dentist by ID
      operationId: getDentistById
      tags: [Dentists]
      parameters:
        - $ref: '#/components/parameters/BigIntId'
      responses:
        '200':
          description: Dentist found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dentist'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      summary: Update dentist
      operationId: updateDentist
      tags: [Dentists]
      parameters:
        - $ref: '#/components/parameters/BigIntId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDentistRequest'
      responses:
        '200':
          description: Dentist updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dentist'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      summary: Delete dentist profile
      operationId: deleteDentist
      tags: [Dentists]
      parameters:
        - $ref: '#/components/parameters/BigIntId'
      responses:
        '204':
          description: Dentist deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ──────────────────── PATIENTS ────────────────────
  /api/patients:
