    delete:
      summary: Remove service from appointment
      operationId: deleteAppointmentService
      tags: [AppointmentServices]
      parameters:
        - $ref: '#/components/parameters/AppointmentIdParam'
        - $ref: '#/components/parameters/BigIntId'
      responses:
        '204':
          description: Appointment service removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
