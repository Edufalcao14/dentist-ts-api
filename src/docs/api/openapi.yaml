          format: email
          nullable: true
        phone:
          type: string
          nullable: true
        stripeCustomerId:
          type: string
          nullable: true
        planType:
          type: string
          example: professional
        planStatus:
          type: string
          example: active
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          nullable: true

