        notes:
          type: string
          nullable: true
        unitPrice:
          type: string
          description: Decimal serialised as string
          example: '150.00'
        lineTotal:
          type: string
          description: Decimal serialised as string
          example: '150.00'
        createdAt:
          type: string
          format: date-time

